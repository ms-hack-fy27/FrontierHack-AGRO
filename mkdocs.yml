site_name: Microsoft Frontier Hackathon
site_description: A hands-on lab teaching you to build, monitor, evaluate, and orchestrate AI agents using the Microsoft Foundry.
site_url: https://ms-hack-fy27.github.io/FrontierHack-AGRO/
repo_url: https://github.com/ms-hack-fy27/FrontierHack-AGRO/
repo_name: ms-hack-fy27/FrontierHack-AGRO/

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Segoe UI
    code: Cascadia Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra_css:
  - overrides/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@11.12.1/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: readme.md
  - Azure Infrastructure: infra.md
  - 📞 Call Center:
      - Overview: callcenter/README.md
      - Challenge 0 — Setup: callcenter/challenge-0-setup/README.md
      - Challenge 1 — Build Agents: callcenter/challenge-1-build/README.md
      - Challenge 2 — Monitor: callcenter/challenge-2-monitor/README.md
      - Challenge 3 — Evaluate: callcenter/challenge-3-evaluate/README.md
      - Challenge 4 — Workflow: callcenter/challenge-4-workflow/README.md
      - Wrap Up: callcenter/wrapup.md
  - 🌱 Smart Farm:
      - Overview: smart-farm/README.md
      - Challenge 0 — Setup: smart-farm/challenge-0-setup/README.md
      - Challenge 1 — Build Agents: smart-farm/challenge-1-build/README.md
      - Challenge 2 — Monitor: smart-farm/challenge-2-monitor/README.md
      - Challenge 3 — Evaluate: smart-farm/challenge-3-evaluate/README.md
      - Challenge 4 — Workflow: smart-farm/challenge-4-workflow/README.md
      - Wrap Up: smart-farm/wrapup.md
  - 🚜 AIgro Tech:
      - Overview: aigro-tech/README.md
      - Challenge 0 — Setup: aigro-tech/challenge-0-setup/README.md
      - Challenge 1 — Build Agents: aigro-tech/challenge-1-build/README.md
      - Challenge 2 — Monitor: aigro-tech/challenge-2-monitor/README.md
      - Challenge 3 — Evaluate: aigro-tech/challenge-3-evaluate/README.md
      - Challenge 4 — Workflow: aigro-tech/challenge-4-workflow/README.md
      - Wrap Up: aigro-tech/wrapup.md
